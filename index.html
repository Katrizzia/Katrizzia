<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store Checkout System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 600px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        .product-box { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        #validationMessage { color: red; font-weight: bold; margin-top: 10px; }
        #orderSummary { background: #f9f9f9; padding: 15px; border-left: 5px solid #007bff; margin-top: 15px; white-space: pre-line; }
    </style>
</head>
<body>

    <h1>MINI STORE CHECKOUT SYSTEM</h1>

    <div class="form-group">
        <label for="customerName">Customer Name</label>
        <input type="text" id="customerName">
    </div>

    <div class="form-group">
        <label for="productCount">Number of Products</label>
        <input type="number" id="productCount" min="1" value="1">
    </div>

    <!-- Container for dynamically generated product inputs -->
    <div id="productsContainer"></div>

    <div class="form-group">
        <label for="deliveryOption">Delivery Option</label>
        <select id="deliveryOption">
            <option value="1">Store Pickup</option>
            <option value="2">Standard Delivery</option>
            <option value="3">Express Delivery</option>
        </select>
    </div>

    <button id="calculateBtn">Calculate Order</button>

    <div id="validationMessage"></div>
    <div id="orderSummary"></div>

    <script src="script.js"></script>
</body>
</html>
